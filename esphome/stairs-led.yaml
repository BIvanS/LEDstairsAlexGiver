# =====================================================================
#  Подсветка лестницы — ESPHome
#  11 ступенек × 24 светодиода WS2812B (5 В), 2 датчика AM312, фоторезистор.
#  Плата: Wemos/Lolin S2 Mini (ESP32-S2). Для ESP32 DevKit — см. README.
#  Рядом с этим файлом должен лежать stairs_logic.h
# =====================================================================

substitutions:
  name: stairs-led
  friendly_name: Лестница
  led_pin: GPIO16        # DATA ленты (через 74AHCT125)
  pir_bottom_pin: GPIO33 # датчик «начало лестницы» (внизу)
  pir_top_pin: GPIO35    # датчик «конец лестницы» (наверху)
  ldr_pin: GPIO3         # фоторезистор (S2: только ADC1 = GPIO1–10)
  adc_max: "2.5"         # верх шкалы АЦП, В (S2 при 12 дБ — 2.5; ESP32 — 3.3)
  power_pin: GPIO18      # затвор полевика, который включает питание ленты
  power_inverted: "false" # "true", если полевик открывается низким уровнем (P-канал без драйвера)
  latitude: "40.21°"     # координаты дома — для расчёта заката и рассвета
  longitude: "-75.01°"
  ambilight_port: "5568" # UDP-порт для Hyperion (устройство «UDP Raw», порт по умолчанию 5568)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - stairs_logic.h

esp32:
  board: lolin_s2_mini
  variant: esp32s2
  framework:
    type: esp-idf

# Синий светодиод на плате (GPIO15): мигает, если нет Wi-Fi или связи с HA
status_led:
  pin: GPIO15

logger:
  level: INFO

api:
  encryption:
    key: !secret stairs_api_key
  # ---- Индикация: вызывается из HA / Node-RED как esphome.stairs_led_notify ----
  actions:
    - action: notify
      variables:
        pattern: string     # solid, pulse, blink, alarm, run_up, run_down, level, steps
        r: int
        g: int
        b: int
        brightness: int     # 0..100 %
        duration: int       # секунд, 0 — пока не остановят
        value: int          # level: 0..100 %; steps: битовая маска ступенек
      then:
        - lambda: 'stairs::notify_start(pattern, r, g, b, brightness, duration, value);'
    - action: notify_stop
      then:
        - lambda: 'stairs::notify_stop();'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Stairs-LED Fallback"
    password: !secret fallback_password

captive_portal:

# ------------------------- Ambilight от Hyperion -------------------------
# Hyperion шлёт сюда цвета по протоколу «UDP Raw»: байты R,G,B подряд.
# В Hyperion: отдельный экземпляр, устройство UDP Raw, адрес лестницы,
# порт ${ambilight_port}, 11 светодиодов (по одному на ступеньку). См. README.
udp:
  id: ambilight_udp
  port: ${ambilight_port}
  on_receive:
    - lambda: 'stairs::ambi_frame(data.data(), data.size());'

# ------------------------- Время и солнце -------------------------
# Время берётся у Home Assistant (без интернета). Пока времени нет
# (HA недоступен после включения), «вечернее окно» считается открытым
# и работает только фоторезистор — как в старой прошивке.
time:
  - platform: homeassistant
    id: ha_time

sun:
  id: sun_c
  latitude: ${latitude}
  longitude: ${longitude}

globals:
  - id: power_on
    type: bool
    initial_value: 'false'

interval:
  # Настройки из HA → движок, плюс такт движка (работает и без питания ленты)
  - interval: 100ms
    then:
      - lambda: |-
          auto &v = id(stairs_light).current_values;
          stairs::cur.enabled = v.is_on();
          stairs::cur.color = Color(v.get_red() * 255, v.get_green() * 255, v.get_blue() * 255);
          stairs::cur.bright = v.get_brightness();
          stairs::cur.auto_motion = id(sw_auto_motion).state;
          stairs::cur.night = id(sw_night).state;
          stairs::cur.auto_bright = id(sw_auto_bright).state;
          stairs::cur.sensor_high = id(pir_bottom).state || id(pir_top).state;
          stairs::cur.light_pct = isnan(id(ldr_pct).state) ? 0 : id(ldr_pct).state;
          stairs::cur.dark_threshold = id(num_dark).state;
          stairs::cur.night_bright = id(num_night_bright).state / 100.0f;
          stairs::cur.timeout_ms = id(num_timeout).state * 1000;
          stairs::cur.step_delay_ms = id(num_step_delay).state;
          stairs::cur.fade_ms = id(num_fade).state;
          stairs::cur.effect_mode = id(sel_effect).active_index().value_or(0);
          stairs::cur.ambi_enabled = id(sw_ambi).state;
          stairs::cur.ambi_evening_only = id(sw_ambi_evening).state;
          stairs::cur.ambi_bright = id(num_ambi_bright).state / 100.0f;
          stairs::tick();

  # >>> sun-window
  # «Вечернее окно»: от (закат − N мин) до (рассвет + M мин)
  - interval: 10s
    then:
      - lambda: |-
          bool win = true;
          std::string on_s = "—", off_s = "—";
          auto t = id(ha_time).now();
          auto ss = id(sun_c).sunset(-0.833);
          auto sr = id(sun_c).sunrise(-0.833);
          if (t.is_valid() && ss.has_value() && sr.has_value()) {
            time_t on_ts = ss.value().timestamp - (time_t) (id(num_on_offset).state * 60);
            time_t off_ts = sr.value().timestamp + (time_t) (id(num_off_offset).state * 60);
            on_s = ESPTime::from_epoch_local(on_ts).strftime("%H:%M");
            off_s = ESPTime::from_epoch_local(off_ts).strftime("%H:%M");
            if (id(sw_evening).state) win = t.timestamp >= on_ts || t.timestamp < off_ts;
          }
          stairs::cur.in_window = win;
          if (id(txt_on_time).state != on_s) id(txt_on_time).publish_state(on_s);
          if (id(txt_off_time).state != off_s) id(txt_off_time).publish_state(off_s);
  # <<< sun-window

  # >>> power
  # Питание ленты. Включение: полевик → 50 мс → кадры. Выключение: гасим ленту
  # и останавливаем кадры → 200 мс → полевик. Так в обесточенную ленту не идут
  # данные (иначе она подпитывается через DIN).
  - interval: 20ms
    then:
      - lambda: |-
          static uint32_t idle_since = 0, t_on = 0, t_off = 0;
          uint32_t now = millis();
          int mode = id(sel_power).active_index().value_or(0);  // 0 авто, 1 вкл, 2 выкл
          bool need = mode == 1 || (mode == 0 && stairs::needs_output());
          if (need) idle_since = now;
          bool want = need || (id(power_on) && now - idle_since < (uint32_t) (id(num_power_hold).state * 1000));
          if (mode == 2) want = false;
          auto *ls = id(strip);
          if (want) {
            if (!id(power_on)) {
              id(strip_power).turn_on();
              id(power_on) = true;
              t_on = now;
            } else if (!ls->remote_values.is_on() && now - t_on >= 50) {
              auto c = ls->turn_on();
              c.set_brightness(1.0f);
              c.set_transition_length(0);
              c.set_effect("Engine");
              c.perform();
            }
          } else if (id(power_on)) {
            if (ls->remote_values.is_on()) {
              auto c = ls->turn_off();
              c.set_transition_length(0);
              c.perform();
              t_off = now;
            } else if (now - t_off >= 200) {
              id(strip_power).turn_off();
              id(power_on) = false;
            }
          }
  # <<< power

# Веб-интерфейс прямо на плате: http://stairs-led.local или по IP.
# local: true — страница целиком хранится в прошивке, интернет не нужен.
web_server:
  port: 80
  version: 3
  local: true
  log: true
  sorting_groups:
    - id: grp_main
      name: "Управление"
      sorting_weight: 1
    - id: grp_state
      name: "Датчики"
      sorting_weight: 2
    - id: grp_settings
      name: "Настройки"
      sorting_weight: 3
    - id: grp_service
      name: "Сервис"
      sorting_weight: 4

# ------------------------- Лента -------------------------
light:
  # Физическая лента — скрыта от HA, ей управляет движок
  - platform: esp32_rmt_led_strip
    id: strip
    rmt_symbols: 256   # вся память RMT у S2: S2 одноядерный, так меньше риск мерцания от Wi-Fi
    internal: true
    pin: ${led_pin}
    num_leds: 264
    chipset: WS2812
    rgb_order: GRB
    # Включается и выключается вместе с полевиком (см. «Питание ленты» ниже)
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: Engine
          update_interval: 20ms
          lambda: |-
            stairs::render(it);

  # То, что видно в HA: вкл/выкл подсветки, цвет и яркость прохода.
  # Выходы-«пустышки»: значения читает движок напрямую.
  - platform: rgb
    id: stairs_light
    name: "Подсветка"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 1
    icon: mdi:stairs
    red: out_r
    green: out_g
    blue: out_b
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

output:
  # Полевик питания ленты
  - platform: gpio
    id: strip_power
    pin:
      number: ${power_pin}
      inverted: ${power_inverted}
  - platform: template
    id: out_r
    type: float
    write_action:
      - lambda: ''
  - platform: template
    id: out_g
    type: float
    write_action:
      - lambda: ''
  - platform: template
    id: out_b
    type: float
    write_action:
      - lambda: ''

# ------------------------- Датчики -------------------------
binary_sensor:
  - platform: gpio
    id: pir_bottom
    name: "Движение внизу"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 1
    device_class: motion
    pin:
      number: ${pir_bottom_pin}
      mode: INPUT_PULLDOWN
    on_press:
      - lambda: |-
          if (stairs::motion(1)) id(walk_event).trigger("up");

  - platform: gpio
    id: pir_top
    name: "Движение наверху"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 2
    device_class: motion
    pin:
      number: ${pir_top_pin}
      mode: INPUT_PULLDOWN
    on_press:
      - lambda: |-
          if (stairs::motion(-1)) id(walk_event).trigger("down");

  - platform: template
    name: "Подсветка горит"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 3
    icon: mdi:stairs-box
    lambda: 'return stairs::busy();'

  - platform: template
    name: "Питание ленты"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 7
    device_class: power
    lambda: 'return id(power_on);'

  - platform: template
    name: "Сейчас вечер"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 8
    icon: mdi:weather-sunset
    lambda: 'return stairs::cur.in_window;'

  - platform: template
    name: "Ambilight принимается"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 11
    icon: mdi:television-ambient-light
    lambda: 'return stairs::ambi_receiving();'

  - platform: status
    name: "Статус"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 1

sensor:
  - platform: adc
    id: ldr_raw
    pin: ${ldr_pin}
    attenuation: 12db
    update_interval: 1s
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 3
    on_value:
      - sensor.template.publish:
          id: ldr_pct
          state: !lambda 'return x / ${adc_max}f * 100.0f;'

  - platform: template
    id: ldr_pct
    name: "Освещённость"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 5
    unit_of_measurement: "%"
    icon: mdi:brightness-6
    accuracy_decimals: 0
    filters:
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "Wi-Fi сигнал"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 2
    update_interval: 60s
    entity_category: diagnostic

  # Сколько цветов в пакете от Hyperion — проверка настройки (ждём 11)
  - platform: template
    name: "Ambilight: цветов в пакете"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 4
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: 'return stairs::ambi_count;'

event:
  - platform: template
    id: walk_event
    name: "Проход"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 4
    icon: mdi:walk
    event_types:
      - up
      - down

text_sensor:
  - platform: template
    id: txt_on_time
    name: "Включение сегодня"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 9
    icon: mdi:weather-sunset-down
  - platform: template
    id: txt_off_time
    name: "Выключение утром"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 10
    icon: mdi:weather-sunset-up
  - platform: template
    name: "Индикация"
    web_server:
      sorting_group_id: grp_state
      sorting_weight: 6
    icon: mdi:message-alert
    update_interval: 1s
    lambda: 'return stairs::notify_name();'

# ------------------------- Настройки -------------------------
select:
  - platform: template
    id: sel_effect
    name: "Эффект"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 2
    icon: mdi:palette
    optimistic: true
    restore_value: true
    options:
      - "Цвет"
      - "Радуга"
      - "Огонь"
      - "По очереди"
    initial_option: "По очереди"
  - platform: template
    id: sel_power
    name: "Питание ленты (режим)"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 7
    icon: mdi:power-plug
    optimistic: true
    restore_value: true
    options:
      - "Авто"
      - "Всегда включено"
      - "Выключено"
    initial_option: "Авто"

switch:
  - platform: template
    id: sw_evening
    name: "Только вечером"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 6
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_auto_motion
    name: "Включать по движению"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 3
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_night
    name: "Ночная подсветка"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 4
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_auto_bright
    name: "Автояркость"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 6
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_ambi
    name: "Ambilight"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 8
    icon: mdi:television-ambient-light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_ambi_evening
    name: "Ambilight только вечером"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 23
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  - platform: template
    id: num_on_offset
    name: "Включать до заката"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 20
    icon: mdi:weather-sunset-down
    unit_of_measurement: min
    min_value: -120
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_off_offset
    name: "Гасить после рассвета"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 21
    icon: mdi:weather-sunset-up
    unit_of_measurement: min
    min_value: -120
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_power_hold
    name: "Задержка снятия питания"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 22
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_timeout
    name: "Таймаут"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 1
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 5
    max_value: 120
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_dark
    name: "Порог темноты"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 2
    icon: mdi:theme-light-dark
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 65   # ≈ старый NIGHT_PHOTO_MAX 500 из 1023 (1.6 В из 2.5)
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_night_bright
    name: "Яркость ночной подсветки"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 3
    icon: mdi:brightness-4
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_step_delay
    name: "Шаг волны"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 4
    icon: mdi:stairs-up
    unit_of_measurement: ms
    min_value: 20
    max_value: 600
    step: 10
    initial_value: 150
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: num_fade
    name: "Плавность ступеньки"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 5
    icon: mdi:gradient-horizontal
    unit_of_measurement: ms
    min_value: 50
    max_value: 2000
    step: 50
    initial_value: 400
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    id: num_ambi_bright
    name: "Яркость Ambilight"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 24
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    entity_category: config

button:
  - platform: template
    name: "Тест: проход вверх"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 7
    icon: mdi:stairs-up
    entity_category: config
    on_press:
      - lambda: 'stairs::motion(1, true);'
  - platform: template
    name: "Тест: индикация"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 8
    icon: mdi:bell-ring
    entity_category: config
    on_press:
      - lambda: 'stairs::notify_start("pulse", 0, 120, 255, 70, 10, 0);'
  - platform: template
    name: "Стоп индикации"
    web_server:
      sorting_group_id: grp_main
      sorting_weight: 5
    icon: mdi:bell-off
    on_press:
      - lambda: 'stairs::notify_stop();'
  - platform: restart
    name: "Перезагрузка"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 3
    entity_category: diagnostic
