# Пример. Эти строки добавляются в /config/esphome/secrets.yaml (сам файл в репозиторий не кладётся).
wifi_ssid: "MyWiFi"
wifi_password: "wifi-password"
fallback_password: "fallback-ap-password"
ota_password: "ota-password"
# 32 байта в base64. ESPHome сгенерирует ключ при создании устройства — скопируй его сюда.
stairs_api_key: "REPLACE_WITH_BASE64_KEY_44_CHARS_LONG_xxxxxx="
